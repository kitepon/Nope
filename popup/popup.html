<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nope</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Nope</h1>

  <fieldset id="display-mode-group" class="cb-display-mode">
    <legend data-i18n="displayModeLegend">Blocked item display</legend>
    <label><input type="radio" name="display-mode" value="placeholder" id="mode-placeholder"> <span data-i18n="displayModePlaceholder">Replace with placeholder</span></label>
    <label><input type="radio" name="display-mode" value="collapse" id="mode-collapse"> <span data-i18n="displayModeCollapse">Hide and collapse</span></label>
  </fieldset>

  <section class="cb-section">
    <p class="cb-label">BLOCKED</p>
    <div id="blocked-list"></div>
  </section>

  <section class="cb-section">
    <p class="cb-label">KEYWORD BLOCK</p>
    <div class="cb-keyword-header">
      <select id="keyword-site">
        <option value="yahoo_news" data-i18n="site_yahoo_news">Yahoo News</option>
        <option value="yahoo_japan" data-i18n="site_yahoo_japan">Yahoo! JAPAN</option>
      </select>
    </div>
    <form id="keyword-form" class="cb-keyword-form">
      <input type="text" id="keyword-input" data-i18n-placeholder="keywordPlaceholder" placeholder="Keyword" required>
      <button type="submit" data-i18n="addKeyword">Add</button>
    </form>
    <p id="keyword-status" class="cb-status"></p>
    <ul id="keyword-list" class="cb-keyword-list"></ul>
  </section>

  <button type="button" id="clear-cache" data-i18n="clearCache">Clear cache</button>

  <footer class="cb-footer">
    <a href="https://kitepon.dev/?utm_source=nope&amp;utm_medium=chrome_extension&amp;utm_campaign=nope-brand-link&amp;utm_content=popup-footer" target="_blank" rel="noopener" class="cb-footer-link">kitepon.dev</a>
  </footer>

  <script src="../src/storage.js"></script>
  <script src="../src/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
